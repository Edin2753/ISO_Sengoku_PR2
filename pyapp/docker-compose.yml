version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: sengoku_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    network_mode: host
    restart: always

  backend:
    build: ./backend
    container_name: sengoku_backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    network_mode: host
    restart: always
