<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clan Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: url("/static/images/background1.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
        }

        .container {
            display: flex;
            align-items: flex-start;
            gap: 25px;
            max-width: 900px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .logo img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #333;
            object-fit: cover;
        }

        .content {
            flex: 1;
        }

        h1 {
            margin: 0 0 15px 0;
            color: #222;
        }

        p strong {
            color: #444;
        }

        ul {
            padding-left: 20px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .back:hover {
            background: #555;
        }

        .error {
            color: #d32f2f;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <img id="clan-image" src="" alt="Clan Logo">
    </div>

    <div class="content">
        <h1 id="clan-name">Loading clan information...</h1>

        <p><strong>Region:</strong> <span id="clan-region"></span></p>
        <p><strong>Leader:</strong> <span id="clan-leader"></span></p>

        <p><strong>Description:</strong></p>
        <p id="clan-description"></p>

        <p><strong>Strengths:</strong></p>
        <ul>
            <li id="clan-str1"></li>
            <li id="clan-str2"></li>
            <li id="clan-str3"></li>
        </ul>

        <p><strong>Legacy:</strong></p>
        <p id="clan-legacy"></p>

        <a class="back" href="/">← Back to Map</a>
    </div>
</div>

<script>
async function loadClan() {
    const params = new URLSearchParams(window.location.search);
    const clanName = params.get("clan");

    if (!clanName) {
        document.getElementById("clan-name").textContent = "Error: No clan specified in URL";
        return;
    }

    try {
        const res = await fetch(`/clan/${clanName.toLowerCase()}`);

        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();


        document.getElementById("clan-name").textContent = data.name || "Unknown Clan";
        document.getElementById("clan-region").textContent = data.region || "—";
        document.getElementById("clan-leader").textContent = data.leader || "—";
        document.getElementById("clan-description").textContent = data.description || "No description available.";

        document.getElementById("clan-str1").textContent = data.str1 || "—";
        document.getElementById("clan-str2").textContent = data.str2 || "—";
        document.getElementById("clan-str3").textContent = data.str3 || "—";

        document.getElementById("clan-legacy").textContent = data.legacy || "—";

        const imgElement = document.getElementById("clan-image");
        imgElement.src = `/static/images/${data.image}`;
        imgElement.alt = data.name || "Clan Logo";

    } catch (error) {
        console.error("Failed to load clan:", error);
        document.getElementById("clan-name").innerHTML = 
            `<span class="error">Failed to load clan data</span>`;
        document.getElementById("clan-description").textContent = 
            "Make sure the backend is running and nginx is proxying /clan/ correctly.";
    }
}

loadClan();
</script>

</body>
</html>
